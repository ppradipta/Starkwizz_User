<ion-header>
  <app-header></app-header>
</ion-header>
<ion-content>
  <div class="page-inner">
    <div class="accounts-container">
      <div class="account-card" *ngFor="let buyer of buyerChats">
        <div class="card-left">
          <div class="user-img" >
            <!-- <ion-img src="assets/images/menu-user.svg"></ion-img> -->
            <ion-img [src]="buyer.user.imageUrl"></ion-img>
          </div>
          <div class="card-inner">
            <ion-label class="user-name">{{buyer.user.displayName}}</ion-label>
            <!-- <ion-label class="school-name">{{buyer.cityName}}, {{buyer.stateName}}
            </ion-label> -->
            <span class="section-label">Class {{buyer.user.className}},
              {{buyer.user.boardName}}</span>
          </div>
          <ion-button (click)="onClickChatWithBuyer(buyer)">
            <ion-icon name="chatbox-ellipses"></ion-icon>Chat
          </ion-button>
          <ion-button  (click)="onClickCallWithBuyer(buyer)">
            <ion-icon name="call"></ion-icon>Call
          </ion-button>
        </div>
      </div>
    </div>

  </div>
</ion-content>
