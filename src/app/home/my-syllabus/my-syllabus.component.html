<ion-content class="date-ion-content">

  <div class="inner-container">
    <div class="headerBtn">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back"></ion-icon>
      </ion-button>
    </div>
    <div class="inner-page">
      <div class="right-top">
        <ion-img src="/assets/svg/combo-design2.svg"></ion-img>
      </div>
      <div class="left-bottom">
        <ion-img src="/assets/svg/combo-design3.svg"></ion-img>
      </div>

      <div class="header">
        <h2>My Syllabus</h2>
        <h4>Hi, {{userDetails.displayName}}</h4>
        <span class="decs">Please check and confirm your academic details.</span>
      </div>

      <div class="custom-card">
        <div class="card-col">
          <ion-label>Education Board</ion-label>
          <span>{{userDetails.boardName}}</span>
        </div>
        <div class="card-col">
          <ion-label>Class/Standard</ion-label>
          <span>{{userDetails.className}} ({{userDetails.classNameWord}} Standard)</span>
        </div>
        <div class="card-col">
          <ion-label>School Name</ion-label>
          <span>{{userDetails.schoolName}}</span>
        </div>
      </div>

      <div class="btn-content">
        <ion-button class="secondary-btn" (click)="confirmSyllabus()">Confirm and Proceed</ion-button>
        <ion-text (click)="modifySyllabus()">Modify</ion-text>
      </div>

      <!-- <div class="subject-container">

        </div>
      </div> -->

  </div>
</ion-content>
