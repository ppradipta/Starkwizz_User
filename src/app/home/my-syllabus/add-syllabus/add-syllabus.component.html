<ion-content class="date-ion-content">
  <div class="inner-container">
    <div class="headerBtn">
      <ion-button (click)="goBack()">
        <ion-icon name="chevron-back"></ion-icon>
      </ion-button>
    </div>
    <div class="inner-page">
      <div class="right-top">
        <ion-img src="/assets/svg/combo-design2.svg"></ion-img>
      </div>
      <div class="left-bottom">
        <ion-img src="/assets/svg/combo-design3.svg"></ion-img>
      </div>

      <div class="header">
        <h4>Hi, {{userDetails.displayName}} ...</h4>
        <span class="decs">For any modification or changes in your syllabus.</span>
        <span class="decs">Please claim your request through the options below.</span>
      </div>

      <div class="custom-body">
        <ion-button class="outline-btn" fill="outline" (click)="callNumber()">
          <ion-icon class="me-2" name="call"></ion-icon>
          <span>Call (11 am – 5 pm) [Except Holidays] </span>
        </ion-button>
        <ion-button class="custom-btn" (click)="onClickEnquiry()">Send Enquiry</ion-button>
      </div>
    </div>
  </div>
</ion-content>
