<ion-header>
  <div class="d-flex align-items-center justify-content-between w-100">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <div class="header-logo">
      <ion-img src="/assets/images/theme-logo.svg"></ion-img>
    </div>
    <div class="d-flex align-items-center" (click)="goBack()">
      <ion-img class="filter-icon" src="/assets/images/filter-blue.svg"></ion-img>
    </div>
  </div>
</ion-header>

<ion-content>
  <div class="page-container">
    <div class="title">
      <h4>Filter</h4>
      <ion-button class="clear-btn" fill="clear">Clear all</ion-button>
    </div>
    <div class="page-inner">
      <div class="vertical-segment">
        <ion-segment (ionChange)="onSegmentValueChanged($event)" [(ngModel)]="segmentValue" mode="md">
          <ion-segment-button value="{{type.id}}" *ngFor="let type of parameterTypes">
            <ion-label>{{type.displayName}}</ion-label>
          </ion-segment-button>
        </ion-segment>
      </div>
      <div class="content-data">
        <div>
          <ion-list>
            <ion-item *ngFor="let param of parameters">
              <ion-label class="checkboxLabel">{{param.displayName}}</ion-label>
              <ion-checkbox slot="start" (ionChange)="checkForTypeValues($event, param)" ></ion-checkbox>
            </ion-item>
          </ion-list>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <div class="footer-toolbar">
    <ion-button fill="clear" class="clear-btn" (click)="goBack()">Close</ion-button>
    <ion-button fill="clear" class="clear-btn apply-btn" (click)="applyFilter()">Apply</ion-button>
  </div>
</ion-footer>
